# JavaSkript config. Docs: https://github.com/mukulx/javaskript
config-version: 2 # do not edit

general:
  debug: false
  update-checker: true
  clean-stack-traces: true # false = full Java stack trace

scripts:
  auto-load: true
  hot-reload:
    enabled: true
    delay-ms: 500 # wait after the last save

dependencies:
  cache-folder: libs

modules: # a disabled module loads nothing
  economy:
    enabled: false
    mode: vault # vault | builtin | auto (Vault if present, else builtin)
    register-vault-service: false # builtin/auto only
    currency:
      symbol: "$"
      name-singular: Coin
      name-plural: Coins
      starting-balance: 0.0

  teams:
    enabled: true
    register-command: true # /team, /clan, /party, /t
    defaults:
      max-size: 0 # 0 = unlimited
      friendly-fire: false
      open: false # true = join without invite
    bank:
      currency: "" # empty = main economy; or a currency a script registered, e.g. "gems"
    tab:
      enabled: true
      vanilla-scoreboard: auto # auto (only without TAB plugin) | always | never
      player-format: "{prefix}{player}{suffix}" # also {suffix} {tag} {team} {role}

  resource-packs:
    enabled: true # packs from scripts are sent to every player who joins
    port: 8163 # HTTP port the packs are downloaded from; open it in your firewall
    bind-address: "" # empty = all interfaces
    public-address: "" # empty = the address players joined with; set it behind a proxy, e.g. "play.example.com" or "https://packs.example.com"
    required: false # default for packs that do not say; players who decline are disconnected
    prompt: "<gray>This server uses a resource pack for its custom content.</gray>"
