# JavaSkript Configuration
# https://github.com/mukulx/javaskript

# File Watcher Settings
# The file watcher automatically reloads scripts when they are modified
file-watcher:
  # Enable or disable automatic script reloading
  # If disabled, you must use /js reload to reload scripts manually
  enabled: true
  
  # Delay in milliseconds before reloading a script after it's modified
  # This prevents multiple reloads when saving files
  reload-delay: 500

# Debug Settings
debug:
  # Enable debug mode to see detailed logging
  # Can be toggled with /js debug command while server is running
  enabled: false

# Error & Diagnostic Settings
errors:
  # Enable clean, smart script stack traces in console
  # If true, isolates the exact script file and line number while stripping out 60+ internal Paper/Folia reflection frames
  # If false, prints the full standard Java stack trace
  clean-stack-traces: true

# Update Checker
update-checker:
  # Check for updates on Modrinth when server starts
  enabled: true

# Script Settings
scripts:
  # Automatically load all scripts on server startup
  auto-load: true

# Dependency Settings
dependencies:
  # Cache directory for downloaded Maven dependencies
  # Relative to the plugin folder
  cache-folder: "libs"

# Economy Settings
# Supports Vault (EssentialsX, CMI, UltraEconomy, etc.) and Built-in SQLite Persistent Economy
economy:
  # Mode: 'auto', 'vault', 'builtin', or 'disabled'
  # - auto: Use Vault if available, otherwise automatically fallback to built-in SQLite engine
  # - vault: Force Vault provider (e.g. EssentialsX, CMI)
  # - builtin: Always use JavaSkript's built-in SQLite persistent economy
  # - disabled: Disable economy features
  mode: "auto"

  # Register JavaSkript as the server's Vault Economy Provider if no other economy plugin is active
  # Allows other plugins (ChestShop, AuctionHouse, ShopGUI+, etc.) to use JavaSkript's economy
  register-vault-service: true

  # Default Currency Settings
  currency:
    symbol: "$"
    name-singular: "Coin"
    name-plural: "Coins"
    starting-balance: 0.0
