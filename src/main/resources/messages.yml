# JavaSkript Messages Configuration
# Semantic palette: <green> success, <red> error, orange hex for highlights.
# Avoid <yellow>/<gold> - they look like low-effort plugins. Orange is used instead.

prefix: "<gray>[<color:#FF8C00>JavaSkript</color>]</gray> "

teams:
  created: "<green>Team <color:#FF8C00>{team}</color> has been created!</green>"
  disbanded: "<red>Team <color:#FF8C00>{team}</color> has been disbanded.</red>"
  joined: "<green>You have joined <color:#FF8C00>{team}</color>!</green>"
  left: "<color:#FFA726>You have left <color:#FF8C00>{team}</color>.</color>"
  member-joined: "<color:#FFA726>{player} has joined the team!</color>"
  member-left: "<color:#FFA726>{player} has left the team.</color>"
  kicked: "<red>You were kicked from <color:#FF8C00>{team}</color> by {kicker}.</red>"
  member-kicked: "<red>{player} was kicked from the team by {kicker}.</red>"
  role-changed: "<color:#FFA726>{player}'s role has been changed to <color:#FF8C00>{role}</color>.</color>"
  friendly-fire-blocked: "<red>You cannot harm your teammate {player}!</red>"
  chat-format: "<aqua>[Team] <color:#FF8C00><role></color> <player>: <white><message></white></aqua>"
  invite-sent: "<green>Invited <color:#FF8C00>{player}</color> to join <color:#FF8C00>{team}</color>!</green>"
  invite-received: "<color:#FFA726>You have been invited to join <color:#FF8C00>{team}</color> by {inviter}!</color>"
  invite-accepted: "<green>You accepted the invite to join <color:#FF8C00>{team}</color>!</green>"
  invite-declined: "<color:#FFA726>You declined the invite to join <color:#FF8C00>{team}</color>.</color>"
  invite-expired: "<red>The invite to join <color:#FF8C00>{team}</color> has expired.</red>"
  invite-self: "<red>You cannot invite yourself!</red>"
  invite-already-member: "<red>{target} is already in your team!</red>"
  home-set: "<green>Team home has been successfully set!</green>"
  home-teleport: "<green>Teleporting to team home...</green>"
  home-not-set: "<red>Your team does not have a home set.</red>"
  not-in-team: "<red>You are not in a team!</red>"
  already-in-team: "<red>You are already in a team!</red>"
  team-not-found: "<red>Team <color:#FF8C00>{team}</color> was not found.</red>"
  team-already-exists: "<red>A team named <color:#FF8C00>{team}</color> already exists!</red>"
  team-full: "<red>Team <color:#FF8C00>{team}</color> is full (max {max} members).</red>"
  full: "<red>This team is full!</red>"
  no-permission: "<red>You do not have permission to do this in your team!</red>"
  bank-deposit: "<green>Deposited {amount} into the team bank. New balance: {balance}</green>"
  bank-withdraw: "<green>Withdrew {amount} from the team bank. New balance: {balance}</green>"
  bank-insufficient-funds: "<red>The team bank does not have enough funds!</red>"
  bank-insufficient: "<red>Insufficient team funds! Current balance: {balance}</red>"
