# JavaSkript Messages Configuration
# Supports MiniMessage (<green>, <gold>, <#FF8C00>, etc.) and legacy formatting (§a, §6)

prefix: "<gray>[<gold>JavaSkript</gold>]</gray> "

teams:
  created: "<green>Team <gold>{team}</gold> has been created!</green>"
  disbanded: "<red>Team <gold>{team}</gold> has been disbanded.</red>"
  joined: "<green>You have joined <gold>{team}</gold>!</green>"
  left: "<yellow>You have left <gold>{team}</gold>.</yellow>"
  member-joined: "<yellow>{player} has joined the team!</yellow>"
  member-left: "<yellow>{player} has left the team.</yellow>"
  kicked: "<red>You were kicked from <gold>{team}</gold> by {kicker}.</red>"
  member-kicked: "<red>{player} was kicked from the team by {kicker}.</red>"
  role-changed: "<yellow>{player}'s role has been changed to <gold>{role}</gold>.</yellow>"
  friendly-fire-blocked: "<red>You cannot harm your teammate {player}!</red>"
  chat-format: "<aqua>[Team] <gold>{role}</gold> {player}: <white>{message}</white></aqua>"
  invite-sent: "<green>Invited <gold>{player}</gold> to join <gold>{team}</gold>!</green>"
  invite-received: "<yellow>You have been invited to join <gold>{team}</gold> by {inviter}!</yellow>"
  invite-accepted: "<green>You accepted the invite to join <gold>{team}</gold>!</green>"
  invite-declined: "<yellow>You declined the invite to join <gold>{team}</gold>.</yellow>"
  invite-expired: "<red>The invite to join <gold>{team}</gold> has expired.</red>"
  invite-self: "<red>You cannot invite yourself!</red>"
  invite-already-member: "<red>{target} is already in your team!</red>"
  home-set: "<green>Team home has been successfully set!</green>"
  home-teleport: "<green>Teleporting to team home...</green>"
  home-not-set: "<red>Your team does not have a home set.</red>"
  not-in-team: "<red>You are not in a team!</red>"
  already-in-team: "<red>You are already in a team!</red>"
  team-not-found: "<red>Team <gold>{team}</gold> was not found.</red>"
  team-already-exists: "<red>A team named <gold>{team}</gold> already exists!</red>"
  team-full: "<red>Team <gold>{team}</gold> is full (max {max} members).</red>"
  full: "<red>This team is full!</red>"
  no-permission: "<red>You do not have permission to do this in your team!</red>"
  bank-deposit: "<green>Deposited {amount} into the team bank. New balance: {balance}</green>"
  bank-withdraw: "<green>Withdrew {amount} from the team bank. New balance: {balance}</green>"
  bank-insufficient-funds: "<red>The team bank does not have enough funds!</red>"
  bank-insufficient: "<red>Insufficient team funds! Current balance: {balance}</red>"
