name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Determine version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
          fi
          echo "Detected version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release tag already exists
        id: check_release
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            if [[ "${GITHUB_REF}" != "refs/tags/${TAG}" ]]; then
              echo "Tag ${TAG} already exists on remote and this is not a tag push. Skipping automated release."
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag push matches ${TAG}. Proceeding with release."
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag ${TAG} does not exist yet. Proceeding with automated release."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Gradle
        if: steps.check_release.outputs.exists != 'true'
        run: ./gradlew clean build shadowJar --no-daemon

      - name: Create or Update GitHub Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: JavaSkript v${{ steps.get_version.outputs.version }}
          files: build/libs/JavaSkript-*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
